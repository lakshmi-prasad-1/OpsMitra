services:
  api:
    build: ./server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:8080}
      DB_DRIVER: sqlite
      SQLITE_PATH: /data/opsmitra.sqlite
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the project root .env}
      JWT_EXPIRES_IN: 8h
      TRUST_PROXY_HOPS: 1
      SERVE_CLIENT: "false"
      # Prototype only: show the password-reset link on screen because no email service is configured.
      PROTOTYPE_RESET_LINKS: ${PROTOTYPE_RESET_LINKS:-true}
      # Optional: set to enable the Claude-powered "Ask OpsMitra" assistant. Without it the built-in engine answers.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-5-5}
    volumes:
      - opsmitra_data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  web:
    build: ./client
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  opsmitra_data:
